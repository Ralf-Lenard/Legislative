name: Hostinger Deploy (Production Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, pdo_mysql, zip
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Environment
        run: cp .env.example .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Tests
        run: php artisan test || true


  build:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Assets
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build || true
          fi

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: public/build


  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: public/build
        continue-on-error: true

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync project to server (NO rsync, use git pull instead)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "🚀 Deploying Laravel..."

            cd domains/${{ secrets.WEBSITE_FOLDER }}

            echo "📥 Pull latest code"
            git reset --hard
            git pull origin main

            echo "📦 Install backend dependencies"
            composer install --no-dev --optimize-autoloader

            echo "⚡ Run migrations"
            php artisan migrate --force || true

            echo "🧹 Optimize Laravel"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            echo "✅ Deployment complete"